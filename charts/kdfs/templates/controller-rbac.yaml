apiVersion: v1
kind: ServiceAccount
metadata:
  name: kdfs-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kdfs.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kdfs-manager-role
  labels:
    {{- include "kdfs.labels" . | nindent 4 }}
rules:
  - apiGroups: ["storage.krea.to"]
    resources: ["volumes", "volumes/status", "engines", "engines/status", "replicas", "replicas/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "nodes", "persistentvolumes", "persistentvolumeclaims", "events", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments", "volumeattachments/status", "csinodes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kdfs-manager-rolebinding
  labels:
    {{- include "kdfs.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kdfs-manager-role
subjects:
  - kind: ServiceAccount
    name: kdfs-controller-manager
    namespace: {{ .Release.Namespace }}
