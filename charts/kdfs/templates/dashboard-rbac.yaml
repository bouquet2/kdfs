{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kdfs-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kdfs.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kdfs-dashboard
  labels:
    {{- include "kdfs.labels" . | nindent 4 }}
rules:
  - apiGroups: ["storage.krea.to"]
    resources: ["volumes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: ["storage.krea.to"]
    resources: ["engines"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.krea.to"]
    resources: ["replicas"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kdfs-dashboard
  labels:
    {{- include "kdfs.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kdfs-dashboard
subjects:
  - kind: ServiceAccount
    name: kdfs-dashboard
    namespace: {{ .Release.Namespace }}
{{- end }}
