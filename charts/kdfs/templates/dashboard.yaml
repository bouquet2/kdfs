{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kdfs-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kdfs.labels" . | nindent 4 }}
    app: kdfs-dashboard
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      app: kdfs-dashboard
  template:
    metadata:
      labels:
        app: kdfs-dashboard
    spec:
      serviceAccountName: kdfs-dashboard
      containers:
        - name: dashboard
          image: {{ include "kdfs.image" .Values.images.dashboard }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: KDFS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kdfs-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kdfs.labels" . | nindent 4 }}
    app: kdfs-dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  selector:
    app: kdfs-dashboard
  ports:
    - port: {{ .Values.dashboard.service.port }}
      targetPort: {{ .Values.dashboard.service.targetPort }}
      name: http
{{- end }}
