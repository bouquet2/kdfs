name: Docker Build
description: Build and optionally push a Docker image for KDFS

inputs:
  image-name:
    required: true
    type: string
    description: Image name (e.g. kdfs-controller-manager)
  tag:
    required: true
    type: string
    description: Image tag (e.g. dev, v0.1.0)
  dockerfile:
    required: true
    type: string
    description: Path to Dockerfile
  push:
    required: false
    default: "true"
    type: string
    description: Whether to push the image to the registry
  registry:
    required: false
    default: ghcr.io
    type: string
    description: Container registry host
  build-contexts:
    required: false
    default: ""
    type: string
    description: Additional --build-context entries (newline-separated)

outputs:
  digest:
    description: Image digest
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and push
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push }}
        tags: ${{ inputs.registry }}/${{ github.repository }}/${{ inputs.image-name }}:${{ inputs.tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-contexts: ${{ inputs.build-contexts }}
