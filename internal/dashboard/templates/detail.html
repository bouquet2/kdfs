{{define "detail"}}
<!DOCTYPE html>
<html lang="en" data-theme="light">
{{template "head" .}}
<body>
{{template "nav" .}}
<main class="container" id="main">
<h2>{{.Volume.Name}}</h2>
<div role="tablist">
  <button role="tab" hx-get="/volumes/{{.Volume.Name}}/overview" hx-target="#tab-content" hx-swap="innerHTML" aria-selected="true">Overview</button>
  <button role="tab" hx-get="/volumes/{{.Volume.Name}}/replicas" hx-target="#tab-content" hx-swap="innerHTML">Replicas</button>
  <button role="tab" hx-get="/volumes/{{.Volume.Name}}/snapshots" hx-target="#tab-content" hx-swap="innerHTML">Snapshots</button>
</div>
<div id="tab-content">
{{template "overview" .}}
</div>
<p style="margin-top:1rem"><a href="/">Back to volumes</a></p>
</main>
<div id="modal"></div>
</body>
</html>
{{end}}
